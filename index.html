<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="평론가 한 사람이 쓴 장문의 영화 리뷰를 싣는 사이트" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="AboutMovie" />
    <meta property="og:description" content="평론가 한 사람이 쓴 장문의 영화 리뷰를 싣는 사이트" />
    <meta property="og:url" content="https://about-movie-ryushin.netlify.app/" />
    <meta property="og:image" content="https://about-movie-ryushin.netlify.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="대표 리뷰 아래로 가상 영화 포스터가 가로로 나열된 AboutMovie 목록 화면"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>AboutMovie</title>
    <script>
      // 첫 화면이 잘못된 테마로 깜빡이지 않도록 렌더링 전에 테마를 정합니다.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('about-movie-theme');
        } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
